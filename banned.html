<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Account Banned</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #070707;
      --card: rgba(17, 17, 17, 0.92);
      --border: rgba(255,255,255,0.06);
      --soft: #8d8d8d;
      --text: #ffffff;
      --danger: #ff3b3b;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    .glow {
      position: absolute;
      width: 900px;
      height: 900px;
      background: radial-gradient(circle, rgba(255, 0, 0, 0.20), transparent 65%);
      filter: blur(100px);
      opacity: 0.9;
    }

    .wrapper {
      position: relative;
      z-index: 2;
      width: 95%;
      max-width: 720px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 42px;
      backdrop-filter: blur(25px);
      box-shadow: 0 0 50px rgba(255,0,0,0.08);
    }

    .top {
      display: flex;
      gap: 20px;
      margin-bottom: 30px;
      align-items: center;
    }

    .icon {
      width: 88px;
      height: 88px;
      border-radius: 24px;
      background: rgba(255, 59, 59, 0.12);
      border: 1px solid rgba(255, 59, 59, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .icon svg {
      width: 42px;
      height: 42px;
      fill: var(--danger);
    }

    h1 {
      font-size: 38px;
      font-weight: 800;
    }

    p {
      color: var(--soft);
      margin-top: 8px;
      line-height: 1.5;
    }

    .details {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .box {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.05);
      border-radius: 16px;
      padding: 18px;
    }

    .label {
      font-size: 12px;
      color: #777;
      text-transform: uppercase;
      margin-bottom: 8px;
      letter-spacing: 1px;
      font-weight: 700;
    }

    .value {
      font-size: 16px;
      font-weight: 600;
    }

    .reason {
      color: #ff6b6b;
    }

    .footer {
      margin-top: 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      border-top: 1px solid rgba(255,255,255,0.05);
      padding-top: 20px;
    }

    .banid {
      color: #777;
      font-size: 13px;
    }

    .btn {
      background: linear-gradient(180deg, #ff3b3b, #c91a1a);
      color: white;
      padding: 12px 18px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 700;
    }
  </style>
</head>

<body>

  <div class="glow"></div>

  <div class="wrapper">
    <div class="card">

      <div class="top">
        <div class="icon">
          <svg viewBox="0 0 24 24">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10
            10-4.48 10-10S17.52 2 12 2zm5 13.59L15.59 17
            12 13.41 8.41 17 7 15.59 10.59 12 7 8.41
            8.41 7 12 10.59 15.59 7 17 8.41 13.41 12
            17 15.59z"/>
          </svg>
        </div>

        <div>
          <h1>Account Banned</h1>
          <p>Your account has been suspended from accessing this platform.</p>
        </div>
      </div>

      <div class="details">

        <div class="box">
          <div class="label">Reason</div>
          <div class="value reason" id="reason">Loading...</div>
        </div>

        <div class="box">
          <div class="label">Banned By</div>
          <div class="value" id="bannedBy">Loading...</div>
        </div>

        <div class="box">
          <div class="label">Ban Date</div>
          <div class="value" id="banDate">Loading...</div>
        </div>

        <div class="box">
          <div class="label">Expires</div>
          <div class="value" id="expires">Loading...</div>
        </div>

      </div>

      <div class="footer">

        <div class="banid" id="banId">Ban ID: ...</div>

        <a class="btn" href="https://discord.gg/frhDrPbe2h">Submit Appeal</a>

      </div>

    </div>
  </div>

<script>
const API_URL = 'https://opslinkservers-backend.onrender.com';

async function loadBan() {
  try {

    const token = localStorage.getItem('token');

    const res = await fetch(`${API_URL}/api/auth/me`, {
      method: 'GET',
      headers: {
        Authorization: `Bearer ${token}`
      }
    });

    const data = await res.json();

    if (!res.ok) {
      document.body.innerHTML = data.error || "Failed to load user.";
      return;
    }

    // not banned → send them away
    if (!data?.ban?.isBanned) {
      window.location.href = "/";
      return;
    }

    const ban = data.ban;

    document.getElementById('reason').textContent =
      ban.reason || "No reason provided";

    document.getElementById('bannedBy').textContent =
      ban.bannedBy || "Unknown";

    document.getElementById('banDate').textContent =
      ban.bannedAt
        ? new Date(ban.bannedAt).toLocaleString()
        : "Unknown";

    document.getElementById('expires').textContent =
      ban.expiresAt
        ? new Date(ban.expiresAt).toLocaleString()
        : "Permanent";

    document.getElementById('banId').textContent =
      "Ban ID: " + (ban.banId || "N/A");

  } catch (err) {
    console.error(err);
    document.body.innerHTML = "Error loading ban data.";
  }
}

loadBan();
</script>

</body>
</html>
