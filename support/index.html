<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Support - OpsLink</title>

<script src="https://cdn.tailwindcss.com"></script>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
body {
  font-family: Inter, sans-serif;
  background: #0b0f19;
  overflow-x: hidden;
}

/* animated background */
.bg-anim {
  position: fixed;
  inset: 0;
  background:
    radial-gradient(circle at 20% 20%, rgba(99,102,241,0.25), transparent 40%),
    radial-gradient(circle at 80% 30%, rgba(16,185,129,0.18), transparent 40%),
    radial-gradient(circle at 50% 80%, rgba(59,130,246,0.15), transparent 40%);
  animation: floatBg 12s ease-in-out infinite alternate;
  z-index: -2;
}

@keyframes floatBg {
  0% { transform: scale(1) translateY(0px); }
  100% { transform: scale(1.08) translateY(-20px); }
}

/* floating blobs */
.blob {
  position: absolute;
  width: 320px;
  height: 320px;
  border-radius: 9999px;
  filter: blur(90px);
  opacity: 0.2;
  animation: blobMove 10s ease-in-out infinite alternate;
}

@keyframes blobMove {
  0% {
    transform: translate(0,0) scale(1);
  }
  100% {
    transform: translate(50px,-30px) scale(1.15);
  }
}

/* glass */
.glass {
  background: rgba(255,255,255,0.04);
  backdrop-filter: blur(16px);
  border: 1px solid rgba(255,255,255,0.06);
}

/* fade in */
.fade-in {
  opacity: 0;
  animation: fadeIn .8s ease forwards;
}

@keyframes fadeIn {
  from {
    opacity: 0;
    transform: translateY(12px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* card */
.card {
  transition: all .3s ease;
}

.card:hover {
  transform: translateY(-8px) scale(1.02);
  box-shadow: 0 20px 60px rgba(0,0,0,.45);
}
</style>
</head>

<body class="text-white">

<div class="bg-anim"></div>

<div class="blob bg-indigo-500 top-0 left-0"></div>
<div class="blob bg-green-500 bottom-0 right-0"></div>

<!-- NAV -->
<header class="glass fixed top-0 w-full z-50">
  <div class="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between">
    <h1 class="font-semibold tracking-tight text-lg">
      OpsLink Support
    </h1>

    <nav class="flex items-center gap-6 text-sm text-gray-300">
      <a href="./legal/" class="hover:text-white transition">
        Legal
      </a>

      <a href="/" class="hover:text-indigo-300 transition">
        Home
      </a>
    </nav>
  </div>
</header>

<!-- HERO -->
<section class="min-h-screen flex items-center justify-center px-6">
  <div class="max-w-3xl mx-auto text-center fade-in">

    <div class="inline-flex items-center gap-2 px-4 py-2 rounded-full glass text-sm text-gray-300 mb-6">
      OpsLink Support Portal
    </div>

    <h2 class="text-5xl md:text-6xl font-bold leading-tight mb-6">
      Need Help?
    </h2>

    <p class="text-gray-400 text-lg max-w-xl mx-auto mb-10">
      Access the OpsLink Help Center for documentation, support articles, and assistance.
    </p>

    <div class="flex justify-center">
      <a
        href="https://help.opslinkservers.com"
        class="group px-8 py-4 rounded-2xl bg-indigo-600 hover:bg-indigo-500 transition-all duration-300 font-semibold text-lg shadow-2xl shadow-indigo-500/20 hover:scale-105"
      >
        Help Center
        <span class="inline-block transition-transform duration-300 group-hover:translate-x-1">
          →
        </span>
      </a>
    </div>

  </div>
</section>

<!-- LEGAL -->
<section class="max-w-5xl mx-auto px-6 pb-24">

  <div class="glass rounded-3xl p-8 md:p-10 fade-in">

    <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-6">

      <div>
        <h3 class="text-2xl font-semibold mb-2">
          Legal Information
        </h3>

        <p class="text-gray-400">
          Review our Terms of Service and Privacy Policy.
        </p>
      </div>

      <a
        href="./legal/"
        class="px-6 py-3 rounded-xl bg-white/10 hover:bg-white/20 transition font-medium text-center"
      >
        View Legal
      </a>

    </div>

  </div>

</section>

<!-- FOOTER -->
<footer class="text-center text-gray-500 text-sm pb-10">
  © 2026 OpsLink. All rights reserved.
</footer>

<!-- PAGE TRANSITION -->
<div
  id="t"
  class="fixed inset-0 bg-black flex items-center justify-center opacity-0 pointer-events-none transition duration-300 z-[9999]"
>
  <img
    id="tl"
    src="assets/opslinkservers.png"
    class="w-32 opacity-0 scale-90 transition-all duration-500"
  />
</div>

<script>
const overlay = document.getElementById("t");
const logo = document.getElementById("tl");

document.addEventListener("click", (e) => {
  const a = e.target.closest("a");
  if (!a) return;

  const href = a.getAttribute("href");

  if (
    !href ||
    href.startsWith("#") ||
    href.startsWith("http") ||
    a.target
  ) return;

  e.preventDefault();

  overlay.style.opacity = "1";
  overlay.style.pointerEvents = "all";

  logo.style.opacity = "1";
  logo.style.transform = "scale(1.08)";
  logo.style.filter = "drop-shadow(0 0 40px rgba(99,102,241,.8))";

  setTimeout(() => {
    window.location.href = href;
  }, 700);
});
</script>

</body>
</html>
